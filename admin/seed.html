// Gerar capa canvas para cada filme
function gerarCapa(filme) {
  var c = document.createElement('canvas');
  c.width = 600; c.height = 340;
  var ctx = c.getContext('2d');

  // Gradiente de fundo
  var grd = ctx.createLinearGradient(0, 0, c.width, c.height);
  filme.grad.forEach(function(cor, i) {
    grd.addColorStop(i / (filme.grad.length - 1), cor);
  });
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, c.width, c.height);

  // Ruído / partículas
  for (var i = 0; i < 80; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.06) + ')';
    ctx.beginPath();
    ctx.arc(Math.random()*c.width, Math.random()*c.height, Math.random()*4, 0, Math.PI*2);
    ctx.fill();
  }

  // Linhas decorativas
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (var j = 0; j < 5; j++) {
    ctx.beginPath();
    ctx.moveTo(Math.random()*c.width, 0);
    ctx.lineTo(Math.random()*c.width, c.height);
    ctx.stroke();
  }

  // Ícone central
  ctx.font = '64px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(filme.icon, c.width/2, c.height/2 - 30);

  // Título
  ctx.font = 'bold 28px Inter, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText(filme.nome, c.width/2, c.height/2 + 30);

  // Tema
  ctx.font = '14px Inter, sans-serif';
  ctx.fillStyle = 'rgba(245,185,90,0.8)';
  ctx.fillText(filme.tema, c.width/2, c.height/2 + 55);

  // Vignette
  var vig = ctx.createRadialGradient(c.width/2, c.height/2, 100, c.width/2, c.height/2, 360);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, c.width, c.height);

  return c.toDataURL('image/jpeg', 0.85);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

// Gerar e salvar
var resultado = filmes.map(function(f, idx) {
  return {
    id: uid() + idx,
    nome: f.nome,
    genero: f.genero,
    duracao: f.duracao,
    descCurta: f.descCurta,
    desc: f.desc,
    capa: gerarCapa(f),
    capitulos: f.caps,
    criado: new Date().toISOString(),
    atualizado: new Date().toISOString()
  };
});

localStorage.setItem('ragui_filmes', JSON.stringify(resultado));
