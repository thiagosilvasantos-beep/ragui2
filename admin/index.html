<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGUI — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- MENU SUPERIOR -->
  <header class="topbar">
    <a href="../index.html" class="topbar__logo">
      <img src="../logo.png" alt="RAGUI" style="height:15px;width:auto">
    </a>
    <span class="topbar__badge">ADMIN</span>
    <nav class="topbar__nav">
      <a href="#" class="topbar__link topbar__link--ativo">🎬 Filmes</a>
    </nav>
  </header>

  <!-- CONTEÚDO -->
  <main class="main">

    <!-- Topo: título + botão novo -->
    <div class="topo">
      <h1>Filmes <span id="contador"></span></h1>
      <button class="btn btn--gold" id="btn-novo">＋ Novo filme</button>
    </div>

    <!-- Formulário de novo/edição (escondido por padrão) -->
    <div class="form-card" id="form-card" hidden>
      <div class="form-card__header">
        <h2 id="form-label">Novo Filme</h2>
        <button class="btn-x" id="form-fechar">&times;</button>
      </div>
      <form id="form-filme">
        <div class="grid-2">
          <div class="campo">
            <label>Nome *</label>
            <input type="text" id="f-nome" required placeholder="Ex: O Código Final">
          </div>
          <div class="grid-2-inner">
            <div class="campo">
              <label>Gênero</label>
              <select id="f-genero">
                <option value="acao">🔥 Ação</option>
                <option value="terror">🔪 Terror</option>
                <option value="suspense">🕵️ Suspense</option>
                <option value="drama">🎭 Drama</option>
                <option value="scifi">🚀 Sci-Fi</option>
              </select>
            </div>
            <div class="campo">
              <label>Duração</label>
              <input type="text" id="f-duracao" placeholder="12 min">
            </div>
          </div>
        </div>

        <div class="campo">
          <label>Descrição curta *</label>
          <input type="text" id="f-desc-curta" required placeholder="Uma frase de impacto" maxlength="120">
        </div>

        <div class="campo">
          <label>Descrição completa</label>
          <textarea id="f-desc" rows="3" placeholder="Sinopse detalhada..."></textarea>
        </div>

        <div class="campo">
          <label>Capa</label>
          <div class="capa-row">
            <div class="capa-thumb" id="capa-thumb">
              <span id="capa-ph">📷</span>
              <img id="capa-img" hidden>
            </div>
            <input type="file" id="capa-file" accept="image/*" hidden>
            <button type="button" class="btn btn--sm" id="btn-upload-capa">📁 Upload</button>
            <button type="button" class="btn btn--sm" id="btn-gerar-capa">🎨 Gradiente</button>
            <button type="button" class="btn btn--sm btn--danger" id="btn-rm-capa" hidden>🗑️</button>
          </div>
        </div>

        <input type="hidden" id="f-id">
        <input type="hidden" id="f-capa-data">

        <div class="form-btns">
          <button type="button" class="btn" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn btn--gold">💾 Salvar</button>
        </div>
      </form>
    </div>

    <!-- Lista de filmes -->
    <div id="lista"></div>

  </main>

  <script src="admin.js"></script>
</body>
</html>
