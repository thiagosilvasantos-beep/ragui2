<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGUI — Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ===================== TOPBAR ===================== -->
  <header class="topbar">
    <div class="topbar__left">
      <a href="../index.html" class="topbar__logo">
        RAG<span>UI</span>
      </a>
      <span class="topbar__badge">ADMIN</span>
    </div>
    <nav class="topbar__nav">
      <button class="topbar__item topbar__item--active" data-page="filmes">
        🎬 Filmes
      </button>
    </nav>
  </header>

  <!-- ===================== CONTEÚDO ===================== -->
  <main class="conteudo">

    <!-- ===== PÁGINA: LISTA DE FILMES ===== -->
    <section class="pagina" id="pagina-filmes">
      <div class="pagina__topo">
        <div>
          <h1 class="pagina__titulo">Filmes</h1>
          <p class="pagina__sub">Gerencie seu catálogo de conteúdos</p>
        </div>
        <button class="btn btn--primary" id="btn-novo">＋ Novo filme</button>
      </div>

      <!-- Lista vazia -->
      <div class="vazio" id="vazio">
        <div class="vazio__icon">🎬</div>
        <h2>Nenhum filme cadastrado</h2>
        <p>Clique em "Novo filme" para começar.</p>
      </div>

      <!-- Tabela de filmes -->
      <div class="tabela-wrap" id="tabela-wrap" hidden>
        <table class="tabela">
          <thead>
            <tr>
              <th width="60">Capa</th>
              <th>Nome</th>
              <th>Gênero</th>
              <th>Capítulos</th>
              <th width="140">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-body"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== PÁGINA: CADASTRO / EDIÇÃO ===== -->
    <section class="pagina" id="pagina-form" hidden>
      <div class="pagina__topo">
        <div>
          <button class="btn-voltar" id="btn-voltar-lista">← Voltar</button>
          <h1 class="pagina__titulo" id="form-titulo">Novo Filme</h1>
        </div>
      </div>

      <form id="form-filme" class="form-filme">
        <div class="form-layout">

          <!-- COLUNA ESQUERDA: Dados do filme -->
          <div class="form-col">
            <div class="card">
              <h3 class="card__titulo">Informações do filme</h3>

              <div class="campo">
                <label for="filme-nome">Nome *</label>
                <input type="text" id="filme-nome" placeholder="Ex: O Código Final" required>
              </div>

              <div class="campos-row">
                <div class="campo">
                  <label for="filme-genero">Gênero</label>
                  <select id="filme-genero">
                    <option value="acao">🔥 Ação</option>
                    <option value="terror">🔪 Terror</option>
                    <option value="suspense">🕵️ Suspense</option>
                    <option value="drama">🎭 Drama</option>
                    <option value="scifi">🚀 Sci-Fi</option>
                  </select>
                </div>
                <div class="campo">
                  <label for="filme-duracao">Duração</label>
                  <input type="text" id="filme-duracao" placeholder="Ex: 12 min">
                </div>
              </div>

              <div class="campo">
                <label for="filme-desc-curta">Descrição curta * <small id="desc-curta-count">0/120</small></label>
                <input type="text" id="filme-desc-curta" placeholder="Uma frase de impacto" maxlength="120" required>
              </div>

              <div class="campo">
                <label for="filme-desc">Descrição completa</label>
                <textarea id="filme-desc" rows="5" placeholder="Sinopse detalhada do filme..."></textarea>
              </div>
            </div>
          </div>

          <!-- COLUNA DIREITA: Capa + Capítulos -->
          <div class="form-col">

            <!-- Capa -->
            <div class="card">
              <h3 class="card__titulo">Capa</h3>
              <div class="capa-box" id="capa-box">
                <span class="capa-box__placeholder" id="capa-placeholder">📷<br>Clique ou arraste uma imagem</span>
                <img id="capa-img" src="" alt="" hidden>
                <input type="file" id="capa-upload" accept="image/*" hidden>
              </div>
              <div class="capa-botoes">
                <button type="button" class="btn btn--ghost btn--sm" id="btn-upload">📁 Upload</button>
                <button type="button" class="btn btn--ghost btn--sm" id="btn-gradiente">🎨 Gerar gradiente</button>
                <button type="button" class="btn btn--ghost btn--sm btn--danger" id="btn-rm-capa" hidden>🗑️</button>
              </div>
              <input type="hidden" id="filme-capa-data">
            </div>

            <!-- Capítulos -->
            <div class="card">
              <div class="card__titulo-row">
                <h3 class="card__titulo">Capítulos</h3>
                <button type="button" class="btn btn--ghost btn--sm" id="btn-add-cap">＋ Adicionar</button>
              </div>
              <div id="caps-lista" class="caps-lista">
                <p class="caps-vazio" id="caps-vazio">Nenhum capítulo. Clique em "Adicionar".</p>
              </div>
            </div>

          </div>
        </div>

        <input type="hidden" id="filme-id">

        <!-- Barra de ações -->
        <div class="form-acoes">
          <button type="button" class="btn btn--ghost" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn btn--primary">💾 Salvar filme</button>
        </div>
      </form>
    </section>

  </main>

  <!-- ===================== MODAL DETALHES ===================== -->
  <div class="modal-overlay" id="modal-detalhes" hidden>
    <div class="modal">
      <div class="modal__topo">
        <h2 id="det-titulo"></h2>
        <button class="modal__x" id="det-fechar">&times;</button>
      </div>
      <div class="modal__corpo">
        <div class="det-capa" id="det-capa"></div>
        <div class="det-tags" id="det-tags"></div>
        <p class="det-curta" id="det-curta"></p>
        <p class="det-desc" id="det-desc"></p>
        <div id="det-caps"></div>
      </div>
      <div class="modal__rodape">
        <button class="btn btn--ghost" id="det-fechar-btn">Fechar</button>
        <button class="btn btn--primary" id="det-editar">✏️ Editar</button>
        <button class="btn btn--danger" id="det-excluir">🗑️ Excluir</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
